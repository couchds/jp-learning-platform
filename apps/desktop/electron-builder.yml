# Keep the released app ID stable so Kakomu upgrades existing Yomunami installations.
appId: com.yomunami.desktop
productName: Kakomu
directories:
  output: release
  buildResources: resources
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**/*
files:
  - out/**/*
  - package.json
extraResources:
  - from: sidecars
    to: sidecars
    filter:
      - "kakomu-*"
  - from: resources/icon.png
    to: app-icon.png
  - from: dictionaries
    to: dictionaries
    filter:
      - "kakomu-dictionary.sqlite"
      - "ATTRIBUTION.md"
icon: resources/icon.png
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
protocols:
  - name: Kakomu
    schemes:
      - kakomu
  - name: Yomunami (legacy)
    schemes:
      - yomunami
win:
  target:
    - nsis
  executableName: Kakomu
mac:
  target:
    - dmg
    - zip
  category: public.app-category.education
linux:
  executableName: kakomu
  maintainer: Kakomu
  syncDesktopName: true
  target:
    - AppImage
    - deb
  category: Education
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /services/desktop-overlay
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /services/recognize
    schedule:
      interval: weekly

name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm test
      - run: npm run build

  desktop-smoke:
    name: Desktop smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64
      - name: Run Electron smoke tests
        if: runner.os != 'Linux'
        run: npm run test:desktop:e2e
      - name: Run Electron smoke tests under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:desktop:e2e
      - name: Upload desktop test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-test-results-${{ matrix.os }}
          path: apps/desktop/test-results
          if-no-files-found: ignore

  package-windows:
    name: Package Windows installer
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, desktop-smoke]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/ocr/requirements.txt
            services/recognize/requirements.txt
      - run: npm ci
      - name: Restore managed service sidecars
        id: sidecar-cache
        uses: actions/cache@v5
        with:
          path: apps/desktop/sidecars
          key: desktop-sidecars-windows-${{ hashFiles('scripts/build_desktop_sidecars.py', 'services/ocr/**', 'services/recognize/**') }}
      - name: Build managed service sidecars
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        run: python scripts/build_desktop_sidecars.py
      - name: Restore bundled dictionary
        id: dictionary-cache
        uses: actions/cache@v5
        with:
          path: |
            apps/desktop/dictionaries/kakomu-dictionary.sqlite
            data/dictionary-source
          key: dictionary-bundle-${{ hashFiles('scripts/build_dictionary_bundle.py') }}
      - name: Build bundled dictionary
        if: steps.dictionary-cache.outputs.cache-hit != 'true'
        run: npm run build:dictionary
      - name: Build Windows installer
        run: npm run make:desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: kakomu-windows-${{ github.sha }}
          path: apps/desktop/release/Kakomu-*-win-x64.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

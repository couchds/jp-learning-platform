name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Package ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
          - os: ubuntu-latest
            artifact: linux
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/ocr/requirements.txt
            services/recognize/requirements.txt
      - run: npm ci
      - name: Build managed service sidecars
        run: python scripts/build_desktop_sidecars.py
      - name: Restore bundled dictionary
        id: dictionary-cache
        uses: actions/cache@v5
        with:
          path: |
            apps/desktop/dictionaries/kakomu-dictionary.sqlite
            data/dictionary-source
          key: dictionary-bundle-${{ hashFiles('scripts/build_dictionary_bundle.py') }}
      - name: Build bundled dictionary
        if: steps.dictionary-cache.outputs.cache-hit != 'true'
        run: npm run build:dictionary
      - name: Build desktop installers
        run: npm run make:desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v7
        with:
          name: kakomu-${{ matrix.artifact }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: kakomu-*
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/* --generate-notes --title "Kakomu ${GITHUB_REF_NAME}"
